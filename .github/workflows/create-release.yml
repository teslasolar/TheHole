name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'
  push:
    paths:
      - '.release-trigger'

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ -f .release-trigger ]; then
            TAG=$(cat .release-trigger | tr -d '[:space:]')
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.tag.outputs.tag }}
          git push origin ${{ steps.tag.outputs.tag }} --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.tag }} — THE HOLE + BLOOM Browser"
          generate_release_notes: true
          draft: false
          prerelease: false
